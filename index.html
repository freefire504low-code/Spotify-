<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Premium</title>
  <!-- Direcciones de iconos oficiales restauradas y seguras -->
  <link rel="icon" href="https://googleapis.com">
  <link rel="icon" type="image/png" href="https://googleapis.com">
  <meta property="og:title" content="Spotify Premium - Música sin anuncios">
  <meta property="og:description" content="Escúchala en todos lados">
  <meta property="og:image" content="https://googleapis.com">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: #181818;
      padding: 35px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }

    .logo-principal {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    p {
      color: #b3b3b3;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .precio {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }

    .periodo {
      font-size: 14px;
      color: #b3b3b3;
      margin-bottom: 25px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 50px;
      background: #1DB954;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #1ed760;
    }

    button:active {
      transform: scale(0.98);
    }

    button svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- Dirección estándar completa para que el logotipo principal sea visible -->
    <svg class="logo-principal" viewBox="0 0 24 24" xmlns="http://w3.org" aria-label="Spotify premium">
      <circle cx="12" cy="12" r="12" fill="#1DB954"/>
      <path d="M16.586 16.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.894-.982-.336.074-.67-.142-.746-.48-.074-.335.143-.67.48-.747 3.856-.88 7.15-.51 9.813 1.126.297.18.388.564.207.86zm1.2-2.44c-.231.378-.728.5-1.104.27-2.72-1.667-6.89-2.158-10.16-1.18-.42.1-.864-.12-.964-.54-.1-.42.12-.864.54-.964 3.674-1.102 8.27-.62 11.58 1.32.375.228.5.72.27 1.104zm.12-2.51c-3.27-1.94-8.73-2.12-11.89-1.17-.492.15-.995-.125-1.145-.615-.15-.492.125-.995.615-1.145 3.79-1.15 9.96-.92 13.55 1.36.445.262.575.848.315 1.293-.262.445-.848.575-1.293.315z" fill="#fff"/>
    </svg>

    <h1>Spotify Premium por 7 meses</h1>

    <p>Disfruta de tu música favorita sin anuncios, en modo offline y con calidad de audio alta durante más de medio año. Escucha sin interrupciones en cualquier dispositivo.</p>

    <div class="precio">$150.00 MXN</div>
    <div class="periodo">pago único por la promoción</div>

    <button id="boton-pago" type="button" onclick="irAlPago()">
      <!-- Dirección estándar completa para que el logotipo del botón sea visible -->
      <svg viewBox="0 0 24 24" xmlns="http://w3.org" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="#1DB954"/>
        <path d="M16.586 16.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.894-.982-.336.074-.67-.142-.746-.48-.074-.335.143-.67.48-.747 3.856-.88 7.15-.51 9.813 1.126.297.18.388.564.207.86zm1.2-2.44c-.231.378-.728.5-1.104.27-2.72-1.667-6.89-2.158-10.16-1.18-.42.1-.864-.12-.964-.54-.1-.42.12-.864.54-.964 3.674-1.102 8.27-.62 11.58 1.32.375.228.5.72.27 1.104zm.12-2.51c-3.27-1.94-8.73-2.12-11.89-1.17-.492.15-.995-.125-1.145-.615-.15-.492.125-.995.615-1.145 3.79-1.15 9.96-.92 13.55 1.36.445.262.575.848.315 1.293-.262.445-.848.575-1.293.315z" fill="#fff"/>
      </svg>
      <span>Pagar con Mercado Pago</span>
    </button>
  </div>

  <script>
    // Tu link oficial de Mercado Pago enlazado correctamente
    const LINK_MERCADO_PAGO = "https://mpago.la/13x4pMi";

    function irAlPago() {
      window.open(LINK_MERCADO_PAGO, "_blank");
    }
  </script>
</body>
</html>
