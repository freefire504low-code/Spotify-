<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Premium</title>
<!-- Icono oficial de Spotify para la pestaña del navegador (Favicon) --> <link rel="icon" href="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_Green.png">
 <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212; /* Fondo oscuro estilo Spotify */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: #181818; /* Tarjeta gris oscuro oficial */
      padding: 35px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }

    /* Estilo para el icono principal superior */
    .logo-principal {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    p {
      color: #b3b3b3; /* Texto secundario gris claro */
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Estilo para el precio destacado */
    .precio {
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }

    .periodo {
      font-size: 14px;
      color: #b3b3b3;
      margin-bottom: 25px;
    }

    /* Botón interactivo con el icono integrado de la app */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 50px; /* Bordes completamente redondeados */
      background: #1DB954; /* Verde oficial de Spotify */
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #1ed760; /* Verde más brillante al pasar el cursor */
    }

    button:active {
      transform: scale(0.98);
    }

    /* Tamaño y color del icono dentro del botón */
    button svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body>

  <div class="card">
    <!-- Icono SVG oficial de la App de Spotify como Logo Principal -->
    <svg class="logo-principal" viewBox="0 0 24 24" xmlns="http://w3.org">
      <circle cx="12" cy="12" r="12" fill="#1DB954"/>
      <path d="M16.586 16.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.894-.982-.336.074-.67-.142-.746-.48-.074-.335.143-.67.48-.747 3.856-.88 7.15-.51 9.813 1.126.297.18.388.564.207.86zm1.223-2.72c-.227.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.082-1.182-.413.125-.85-.107-.975-.522-.125-.413.108-.85.522-.975 3.678-1.116 8.246-.574 11.35 1.335.366.226.486.706.26 1.073zm.105-2.833c-2.484-.737-8.13-1.013-11.396-.022-.503.153-1.03-.134-1.183-.637-.152-.503.134-1.03.637-1.183 3.756-1.14 10-.927 13.98 1.434.454.137.705.616.568 1.07-.137.454-.616.706-1.07.568z" fill="#000000"/>
    </svg>

    <h1>Spotify Premium por 7 meses</h1>

    <p>Disfruta de tu música favorita sin anuncios, en modo offline y con calidad de audio alta durante más de medio año. Escucha sin interrupciones en cualquier dispositivo.</p>

    <!-- Sección de Precio -->
    <div class="precio">$150.00 MXN</div>
    <div class="periodo">pago único por la promoción</div>

    <button id="boton-pago" onclick="irAlPago()">
      <!-- Icono SVG oficial de la App de Spotify (Versión secundaria para el botón) -->
      <svg viewBox="0 0 24 24" xmlns="http://w3.org">
        <circle cx="12" cy="12" r="12" fill="#1DB954"/>
        <path d="M16.586 16.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.894-.982-.336.074-.67-.142-.746-.48-.074-.335.143-.67.48-.747 3.856-.88 7.15-.51 9.813 1.126.297.18.388.564.207.86zm1.223-2.72c-.227.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.082-1.182-.413.125-.85-.107-.975-.522-.125-.413.108-.85.522-.975 3.678-1.116 8.246-.574 11.35 1.335.366.226.486.706.26 1.073zm.105-2.833c-2.484-.737-8.13-1.013-11.396-.022-.503.153-1.03-.134-1.183-.637-.152-.503.134-1.03.637-1.183 3.756-1.14 10-.927 13.98 1.434.454.137.705.616.568 1.07-.137.454-.616.706-1.07.568z" fill="#000000"/>
      </svg>
      <span>Pagar con Mercado Pago</span>
    </button>
  </div>

  <script>
    function irAlPago() {
      // Abre tu enlace real de Mercado Pago en una pestaña nueva
      window.open("https://mpago.la", "_blank");
    }
  </script>

</body>
</html>
